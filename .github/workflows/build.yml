name: build apk

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: build stockfish for android (arm64)
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "using ndk at $NDK"
          export PATH="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          git clone --depth 1 --branch sf_17.1 https://github.com/official-stockfish/Stockfish.git
          cd Stockfish/src
          make -j4 build ARCH=armv8 COMP=ndk
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          cp stockfish "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libstockfish.so"
          file stockfish || true

      - name: build illusion for android (arm64)
        run: |
          # brody's own engine (github.com/doomanity/Illusion), pure rust: one cross compile with the ndk's linker
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang"
          rustup target add aarch64-linux-android
          git clone --depth 1 https://github.com/doomanity/Illusion.git
          cd Illusion/engine
          cargo build --release --target aarch64-linux-android --bin illusion
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          cp target/aarch64-linux-android/release/illusion "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libillusion.so"
          file target/aarch64-linux-android/release/illusion || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: signing key (from the repo secrets, so every build can update the app in place)
        env:
          KEY_B64: ${{ secrets.SIGNING_KEY_B64 }}
        run: |
          if [ -n "$KEY_B64" ]; then
            echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_STORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "no SIGNING_KEY_B64 secret: this build gets a random key and won't install over the old app"
          fi

      - name: build apk
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: chess-helper-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: publish apk as a release (easy download on your phone)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest app/build/outputs/apk/debug/app-debug.apk \
            --title "latest build" --notes "newest apk, built from the last push"

  # the pc app (windows): the same board reader and move follower, a see-through overlay, engines included
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: build the pc app
        run: gradle -p desktop installDist --no-daemon
      - name: engines (stockfish, illusion)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p engines
          # stockfish: the fast build, and a compatible one for older cpus (the app starts the first that runs)
          # the release's file names change between versions: list them and pick the windows builds by pattern
          names=$(gh release view -R official-stockfish/Stockfish --json assets -q '.assets[].name')
          echo "$names"
          # newer releases have one universal build (it picks the cpu's features itself), older ones avx2 + sse41
          fast=$(echo "$names" | grep -i windows | grep -i 'x86-64-avx2' | head -1 || true)
          [ -z "$fast" ] && fast=$(echo "$names" | grep -i windows | grep -i 'x86-64' | head -1 || true)
          compat=$(echo "$names" | grep -i windows | grep -iE 'x86-64-sse41' | head -1 || true)
          echo "fast: $fast  compatible: $compat"
          gh release download -R official-stockfish/Stockfish --pattern "$fast" -D sf
          (cd sf && 7z x -y "$fast" > /dev/null; true)
          (cd sf && for t in *.tar; do [ -f "$t" ] && 7z x -y "$t" > /dev/null; done; true)
          cp "$(find sf -iname '*.exe' | head -1)" engines/stockfish.exe
          if [ -n "$compat" ]; then
            gh release download -R official-stockfish/Stockfish --pattern "$compat" -D sf2
            (cd sf2 && 7z x -y "$compat" > /dev/null; true)
            (cd sf2 && for t in *.tar; do [ -f "$t" ] && 7z x -y "$t" > /dev/null; done; true)
            cp "$(find sf2 -iname '*.exe' | head -1)" engines/stockfish-compat.exe || true
          fi
          # brody's own engine, latest main
          git clone --depth 1 https://github.com/doomanity/Illusion.git
          (cd Illusion/engine && cargo build --release --bin illusion) && cp Illusion/engine/target/release/illusion.exe engines/
          ls -la engines
      - name: package (java included, no install needed)
        shell: bash
        run: |
          jpackage --type app-image --name ChessHelper --app-version 1.0.${{ github.run_number }} \
            --input desktop/build/install/chess-helper-pc/lib --main-jar chess-helper-pc.jar \
            --main-class com.example.chesshelper.pc.MainKt --java-options "-Dsun.java2d.uiScale=1" --dest out
          mkdir -p out/ChessHelper/app/engines
          cp engines/* out/ChessHelper/app/engines/
          (cd out && 7z a -tzip ../ChessHelper-windows.zip ChessHelper > /dev/null)
          ls -la ChessHelper-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ChessHelper-windows
          path: ChessHelper-windows.zip
